<!-- The wrapper is what scrolls, so it takes focus. Without a tabindex a keyboard-only learner has
     no way to reach content below the fold (WCAG 2.1.1), and this component has no other focusable
     element at all. -->
<div class="csl-wrapper" id="csl-wrapper" tabindex="0" role="region" aria-label="Slide content">
  <div class="csl-inner" id="csl-inner">
    <div class="csl-text-col">
      <h2 class="csl-heading kbf-display-field" id="csl-heading"></h2>
      <div class="csl-body" id="csl-body"></div>
    </div>
    <div class="csl-image-col" id="csl-image-col">
      <img class="csl-image" id="csl-image" src="" alt="" />
    </div>
  </div>
</div>
