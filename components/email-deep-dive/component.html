<div class="ed-wrapper">
  <!-- Email display -->
  <div class="ed-email" role="article" aria-label="Email">
    <div class="ed-outer">
      <!-- Subject bar -->
      <div class="ed-subject-bar" id="ed-subject-bar"></div>
      <!-- Inner email -->
      <div class="ed-inner">
        <div class="ed-header">
          <div class="ed-avatar" id="ed-avatar" aria-hidden="true"></div>
          <div class="ed-meta" id="ed-meta">
            <!-- From / To / Date injected by JS -->
          </div>
          <div class="ed-toolbar" aria-hidden="true">
            <span class="ed-toolbar-icon" title="Like">&#128077;</span>
            <span class="ed-toolbar-icon" title="Reply">&#8617;</span>
            <span class="ed-toolbar-icon" title="Reply all">&#8619;</span>
            <span class="ed-toolbar-icon" title="Forward">&#9658;</span>
          </div>
        </div>
        <div class="ed-body" id="ed-body"></div>
      </div>
    </div>
  </div>

  <!-- Flag list -->
  <!-- No `aria-label` here: ARIA prohibits it on a role-less `<div>` and screen readers drop it, and
       the `<h3>` below already names this section. -->
  <div class="ed-flags" id="ed-flags">
    <h3 class="ed-flags-heading">Analyze this email — select each flag to review:</h3>
    <ul class="ed-flag-list" id="ed-flag-list" role="list"></ul>
  </div>

  <!-- Flag detail panel (fixed overlay) -->
  <div
    class="ed-panel kbf-scrim"
    id="ed-panel"
    hidden
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    aria-label="Flag detail"
  >
    <div class="ed-panel-box" id="ed-panel-box">
      <button class="ed-panel-close kbf-close" id="ed-panel-close" type="button" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="ed-panel-content" id="ed-panel-content"></div>
    </div>
  </div>
</div>
