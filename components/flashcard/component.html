<div class="fc-stage">
  <div class="fc-scene">
    <div class="fc-card" id="fc-card" role="button" tabindex="0" aria-pressed="false">
      <div class="fc-face fc-front">
        <div class="fc-accent" id="fc-accent" aria-hidden="true"></div>
        <h2 class="fc-front-title" id="fc-front-title"></h2>
        <p class="fc-front-label" id="fc-front-label"></p>
        <p class="fc-hint" aria-hidden="true">Tap to reveal</p>
      </div>
      <div class="fc-face fc-back" aria-hidden="true" id="fc-back">
        <div class="fc-accent" aria-hidden="true"></div>
        <h3 class="fc-back-title" id="fc-back-title"></h3>
        <p class="fc-back-desc" id="fc-back-desc"></p>
      </div>
    </div>
  </div>
  <p class="fc-sr-status" id="fc-sr-status" aria-live="polite" aria-atomic="true"></p>
</div>
