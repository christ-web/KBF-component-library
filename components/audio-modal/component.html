<div class="am-wrapper">
  <!-- `role="group"` with a name, not `role="list"`: every child here is operable — clicking a tile
       opens its player, the component's only interaction — and `role="list"` forces its children to be
       list items, which is what silenced that. Same fix as branching-scenario's choices, reached from
       the other side. The name is static because nothing in the settings panel titles this set. -->
  <div class="am-tiles" id="am-tiles" role="group" aria-label="Audio tracks">
    <!-- Audio tile cards injected by JS -->
  </div>
  <div
    class="am-overlay kbf-scrim"
    id="am-overlay"
    hidden
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    aria-label="Audio player"
  >
    <div class="am-box" id="am-box">
      <button class="am-close kbf-close" id="am-close" type="button" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="am-player" id="am-player">
        <!-- Audio player built by JS when modal opens -->
      </div>
    </div>
  </div>
</div>
