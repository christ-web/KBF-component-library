<div class="dda-wrapper">
  <div class="dda-header">
    <h2 class="dda-title" id="dda-title"></h2>
    <p class="dda-instructions" id="dda-instructions"></p>
  </div>
  <ul class="dda-questions" id="dda-questions" aria-label="Dropdown questions"></ul>
  <div class="dda-controls" id="dda-controls">
    <button class="dda-submit kbf-btn" id="dda-submit-btn" type="button" disabled aria-disabled="true">Submit</button>
  </div>
  <div class="dda-feedback-panel" id="dda-feedback" hidden tabindex="-1" role="alert" aria-live="assertive">
    <div class="dda-feedback-header">
      <span class="dda-feedback-icon" id="dda-feedback-icon" aria-hidden="true"></span>
      <p class="dda-feedback-text" id="dda-feedback-text"></p>
    </div>
    <button class="dda-try-again kbf-btn kbf-btn--secondary" id="dda-try-again-btn" type="button" style="display:none;">Try Again</button>
  </div>
</div>
